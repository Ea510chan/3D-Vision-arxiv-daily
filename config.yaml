# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "Vincentqyw"
repo_name: "cv-arxiv-daily"
repo_url: "https://github.com/Ea510chan/3D-Vision-arxiv-daily"
pages_url: "https://ea510chan.github.io/3D-Vision-arxiv-daily/"
show_authors: True
show_links: True
show_badge: False
max_results: 10
backfill_abstracts: True
backfill_max_papers: 0
backfill_chunk_size: 25
backfill_sleep_seconds: 1.2

publish_readme: True
publish_gitpage: True
publish_wechat: False

# file paths
json_readme_path: './docs/cv-arxiv-daily.json'
json_gitpage_path: './docs/cv-arxiv-daily-web.json'
json_wechat_path: './docs/cv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'
md_readme_topics_dir: './topics'
md_gitpage_topics_dir: './docs/topics'

# keywords to search
keywords:
    "Point Cloud Registration":
        filters: ["Point Cloud Registration", "3D Registration", "LiDAR Registration", "Point Cloud Matching", "Multi-View Point Cloud Registration", "Image-to-Point Cloud Registration"]
    "Image Matching":
        filters: ["Image Matching", "Keypoint Matching",
                  "Line Segment Detection", "Local Feature Matching"]
    "SLAM":
        filters: ["SLAM", "Visual Odometry"]
    "3D Reconstruction":
        filters: ["3D Reconstruction", "Scene Reconstruction",
                  "SFM", "Structure from Motion",
                  "Multi-View Stereo", "MVS",
                  "Surface Reconstruction", "Mesh Reconstruction",
                  "Dense Reconstruction", "Geometry Reconstruction"]
    "Novel View Synthesis":
        filters: ["Novel View Synthesis", "View Synthesis",
                  "Feed-forward Novel View Synthesis",
                  "Generalizable Novel View Synthesis",
                  "Sparse-View Synthesis", "Few-Shot View Synthesis",
                  "Dynamic View Synthesis", "Neural Rendering",
                  "Radiance Field Rendering", "NeRF Rendering",
                  "Gaussian Splatting Rendering",
                  "Gaussian Splatting View Synthesis",
                  "3DGS View Synthesis"]
    "Visual Localization":
        filters: ["Visual Localization","Camera Localization",
                  "Camera Re-localisation","Loop Closure Detection",
                  "visual place recognition"]
    "3D Localization":
        filters: ["3D Localization", "3D Relocalization",
                  "3D Scene Localization", "Structure-Based Localization",
                  "Map-Based Localization", "Scene Coordinate Regression",
                  "Point Cloud Localization", "LiDAR Localization",
                  "NeRF Localization", "Neural Radiance Field Localization",
                  "Gaussian Splatting Localization", "3D Gaussian Localization",
                  "3DGS Localization", "Camera Pose Refinement",
                  "VGGT Localization", "VGGT Pose"]
    "World Model":
        filters: ["World Model", "World Models",
                  "Video Prediction Model", "Video Generation Model",
                  "Neural World Simulator", "World Simulator",
                  "Predictive World Model", "Action-Conditioned Video Prediction",
                  "Autonomous Driving World Model", "Embodied World Model"]
    "Flow Matching":
        filters: ["Flow Matching", "Rectified Flow",
                  "Conditional Flow Matching", "Flow-Based Policy",
                  "Flow Matching for Video", "Flow-Based Generation",
                  "Diffusion Bridge", "Stochastic Interpolant",
                  "Flow Matching for 3D", "Flow Matching for Robot"]

# topic maintenance
topic_merge:
    "3D Registration": "Point Cloud Registration"
    "SFM": "3D Reconstruction"
topic_drop:
    - "Keypoint Detection"
    - "NeRF"
    - "Gaussian Splatting"
